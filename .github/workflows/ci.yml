name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs this whole workflow first and publishes the `dist` artifact the kit job built.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: fmt · clippy · tests · install.sh · IPP Everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain pin lives in rust-toolchain.toml only; install exactly that and assert it
      # (rustup would otherwise silently use the file's channel while @stable installs another).
      - id: tc
        name: Read the toolchain pin
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ steps.tc.outputs.channel }}"
          components: rustfmt, clippy

      - name: Assert the toolchain
        run: rustc --version && rustc --version | grep -F " ${{ steps.tc.outputs.channel }}."

      - uses: Swatinem/rust-cache@v2

      # ipptool + /usr/share/cups/ipptool/*.test come from cups-ipp-utils; no cupsd needed.
      - name: Install ipptool and shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cups-ipp-utils shellcheck

      # CATPRINTER_REQUIRE_IPPTOOL turns the e2e test's "ipptool missing" skips into failures.
      - name: make check (fmt, clippy -D warnings, tests, install.sh, fleet-test.sh, units)
        run: make check
        env:
          CATPRINTER_REQUIRE_IPPTOOL: "1"

      - name: Build debug binary
        run: cargo build --locked

      # The compliance gate: run PWG/CUPS's own ipp-everywhere.test against a fake-printer daemon.
      # A [FAIL] is only tolerated when its test name is listed verbatim in tests/ipptool/allowlist.txt
      # (one name per line, no comments; the file is empty on purpose — the target is zero failures).
      - name: IPP Everywhere suite against --fake-printer
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake
          ./target/debug/catprinterd serve --port 8096 --fake-printer /tmp/fake --dnssd off --log-level warn &
          DAEMON=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8096/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8096/health
          ipptool -V 2.0 -tI -f tests/fixtures/text-roll48.pwg -d filetype=image/pwg-raster \
            ipp://127.0.0.1:8096/ipp/print /usr/share/cups/ipptool/ipp-everywhere.test | tee ippeve.log
          rc=0
          while read -r name; do
            if ! grep -qxF "$name" tests/ipptool/allowlist.txt; then
              echo "::error::ipp-everywhere.test FAIL not allowlisted: $name"; rc=1
            fi
          done < <(grep '\[FAIL\]' ippeve.log | sed 's/ *\[FAIL\].*//; s/^ *//' || true)
          for t in get-jobs print-job-and-wait ipp-backend identify-printer create-job validate-job; do
            ipptool -tv -f tests/fixtures/photo-roll48.pwg -d filetype=image/pwg-raster \
              ipp://127.0.0.1:8096/ipp/print /usr/share/cups/ipptool/$t.test | tee -a ippeve.log | grep -q '\[FAIL\]' && { echo "::error::$t.test failed"; rc=1; } || true
          done
          ls -la /tmp/fake
          kill $DAEMON || true
          exit $rc

      - name: Upload ipptool log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipptool-log
          path: ippeve.log
          if-no-files-found: ignore

  # The release bytes: kit tarball + image files, built on the oldest supported glibc (ubuntu-22.04,
  # glibc 2.35). VERSION shape is asserted here because the fleet validator reads field 1.
  kit:
    name: kit + image-files (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - id: tc
        name: Read the toolchain pin
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ steps.tc.outputs.channel }}"

      - uses: Swatinem/rust-cache@v2

      - name: make kit image-files
        run: make kit image-files

      - name: Assert VERSION shape (<semver> <sha> <utc>; field 1 == crate version)
        run: |
          set -euo pipefail
          v=$(make -s version)
          for f in dist/catprinter-kit/VERSION dist/image-root/usr/lib/catprinter/VERSION; do
            echo "$f: $(cat "$f")"
            test "$(cut -d' ' -f1 "$f")" = "$v" && test "$(wc -w < "$f")" = 3 || { echo "::error::$f: $(cat "$f")"; exit 1; }
          done
          cmp dist/catprinter-kit/VERSION dist/image-root/usr/lib/catprinter/VERSION
          test "$(dist/catprinter-kit/catprinterd --version)" = "catprinterd $v"
          test -L dist/image-root/etc/systemd/system/multi-user.target.wants/catprinter.service
          test -L dist/image-root/etc/systemd/system/multi-user.target.wants/catprinter-queue.service
          test -x dist/image-root/usr/lib/catprinter/install.sh
          ls -la dist/ dist/catprinter-kit/

      # Tar the whole dist tree before uploading: the image-root ships
      # multi-user.target.wants/*.service symlinks that point at absolute /usr paths, and
      # actions/upload-artifact follows symlinks (dropping these unresolvable ones). tar keeps
      # them as symlinks (they resolve inside the fedora image after COPY image-root/ /) and
      # preserves file modes too.
      - name: Bundle dist (preserve symlinks + modes)
        run: tar -czf dist.tar.gz dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
          if-no-files-found: error

  # Boots the kit and the image files in real systemd containers (see scripts/fleet-test.sh):
  # image-baked rebase case, kit path, kit->image migration, a print through CUPS.
  fleet-test:
    name: fleet-test (systemd in podman)
    runs-on: ubuntu-latest
    needs: kit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Unbundle dist (symlinks + modes intact)
        run: |
          tar -xzf dist.tar.gz
          test -L dist/image-root/etc/systemd/system/multi-user.target.wants/catprinter.service \
            || { echo "::error::wants symlink lost in transit"; exit 1; }

      - name: Run the fleet test
        run: |
          podman --version
          sudo PODMAN=podman scripts/fleet-test.sh

      - name: Upload fleet logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-test-logs
          path: tests/out/fleet/*.log
          if-no-files-found: ignore
