name: Release kit

# Tag vX.Y.Z (matching Cargo.toml) → run the whole CI (check + kit built on ubuntu-22.04 + the
# fleet test against those exact bytes) → attach the tested kit tarball + SHA256SUMS to a GitHub
# Release. install.sh --download fetches exactly these files; a tag with a `-` (v0.2.1-rc1) becomes a
# pre-release, so `--download latest` never picks it up.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI (check · kit · fleet-test)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish catprinter-kit
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          set -euo pipefail
          v="v$(make -s version)"
          # tag must be vX.Y.Z or a pre-release of it (vX.Y.Z-rc1, vX.Y.Z-beta2 …)
          case "${GITHUB_REF_NAME}" in
            "$v"|"$v"-*) ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo version $v"; exit 1 ;;
          esac

      # The `dist` artifact is the one the fleet test just booted — publish exactly those bytes.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Unbundle and verify the tested kit
        run: |
          tar -xzf dist.tar.gz
          ls -la dist/
          cat dist/SHA256SUMS
          echo "VERSION: $(cat dist/catprinter-kit/VERSION)"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/catprinter-kit-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
