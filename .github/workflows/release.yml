name: Release kit

# Tag vX.Y.Z (matching Cargo.toml) → run the whole CI (check + kit built on ubuntu-22.04 + the
# fleet test against those exact bytes) → attach the tested kit tarball + SHA256SUMS to a GitHub
# Release. install.sh --download fetches exactly these files; a tag with a `-` (v0.2.1-rc1) becomes a
# pre-release, so `--download latest` never picks it up.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI (check · kit · fleet-test)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish catprinter-kit
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          set -euo pipefail
          v="v$(make -s version)"
          # tag must be vX.Y.Z or a pre-release of it (vX.Y.Z-rc1, vX.Y.Z-beta2 …)
          case "${GITHUB_REF_NAME}" in
            "$v"|"$v"-*) ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo version $v"; exit 1 ;;
          esac

      - name: Retract mistaken v3.0.0 if it is still published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 3.0.0 > 0.3.0; leaving that release makes --download latest / version-sorted clients wrong.
          gh release delete v3.0.0 --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/3.0.0" || true

      - name: Release notes from CHANGELOG
        run: |
          set -euo pipefail
          v="$(make -s version)"
          awk -v ver="$v" '
            $1=="##" && $2==ver {p=1; print; next}
            /^## / {if (p) exit}
            p
          ' CHANGELOG.md > relnotes.md
          test -s relnotes.md
          cat relnotes.md

      # x86_64 `dist` is the fleet-tested kit; `dist-aarch64` is the native ARM kit (same glibc 2.35).
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: dist-aarch64
          path: .

      - name: Unbundle and verify the tested kits
        run: |
          set -euo pipefail
          tar -xzf dist.tar.gz
          mkdir -p /tmp/arm
          tar -xzf dist-aarch64.tar.gz -C /tmp/arm
          cp /tmp/arm/catprinter-kit-*.tar.gz dist/
          cat /tmp/arm/SHA256SUMS >> dist/SHA256SUMS
          ls -la dist/
          cat dist/SHA256SUMS
          echo "VERSION: $(cat dist/catprinter-kit/VERSION)"
          grep -q 'catprinter-kit-x86_64.tar.gz' dist/SHA256SUMS
          grep -q 'catprinter-kit-aarch64.tar.gz' dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/catprinter-kit-*.tar.gz
            dist/SHA256SUMS
          body_path: relnotes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
